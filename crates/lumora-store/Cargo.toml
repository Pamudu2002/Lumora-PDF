[package]
name = "lumora-store"
description = "SQLite storage (recents, settings, library) for Lumora PDF"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Derive `specta::Type` on IPC-facing types (used by the desktop app's TypeScript bindings).
specta = ["dep:specta"]

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
thiserror = "2"
tracing = "0.1"

[lints]
workspace = true
