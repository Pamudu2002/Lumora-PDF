[package]
name = "lumora-desktop"
description = "Lumora PDF desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "lumora_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lumora-core = { workspace = true, features = ["specta"] }
lumora-engine = { workspace = true, features = ["specta"] }
lumora-render.workspace = true
lumora-store = { workspace = true, features = ["specta"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tauri-specta v2 is in RC: keep `=` pins on specta crates (see tauri-specta docs).
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[lints]
workspace = true
