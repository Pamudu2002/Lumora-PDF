<div class="app" data-theme="light">

  <header class="lu-titlebar">
    <div class="lu-appmark">Lumora <span>PDF</span></div>
    <div class="lu-tab is-active"><span class="lu-tab__name">Lease agreement.pdf</span><span class="lu-tab__dot" aria-label="Unsaved changes"></span><button class="lu-iconbtn" aria-label="Close tab"><svg class="lu-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>

    <div class="lu-winctl">
      <button aria-label="Minimize"><svg class="lu-icon" viewBox="0 0 24 24"><path d="M6 12h12"></path></svg></button>
      <button aria-label="Maximize"><svg class="lu-icon" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"></rect></svg></button>
      <button aria-label="Close window"><svg class="lu-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
  </header>

    <button class="lu-iconbtn" aria-label="Toggle sidebar"><svg class="lu-icon lu-icon--md" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg></button>
    <button class="lu-iconbtn" aria-label="Find (Ctrl+F)"><svg class="lu-icon lu-icon--md" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
    <div class="lu-groups" role="tablist">
      <button class="lu-group" role="tab">View</button>
      <button class="lu-group" role="tab">Annotate</button>
      <button class="lu-group is-active" role="tab" aria-selected="true">Organize</button>
      <button class="lu-group" role="tab">Fill &amp; sign</button>
      <button class="lu-group" role="tab">Edit</button>
      <button class="lu-group" role="tab">Protect</button>
      <button class="lu-group" role="tab">Convert</button>
    </div>
    <button class="lu-iconbtn" aria-label="Undo (Ctrl+Z)"><svg class="lu-icon lu-icon--md" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-4"></path></svg></button>

    <button class="lu-btn lu-btn--primary lu-btn--sm" style="margin-left: 6px">Save</button>
  </nav>
